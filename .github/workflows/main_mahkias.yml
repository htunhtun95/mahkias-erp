# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mahkias

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        working-directory: Mahkias.WebApp
        run: |
          npm ci
          npm run build
          npm install serve@14 --prefix dist/Mahkias.WebApp/browser --omit=dev
          npm pkg set scripts.start='node node_modules/serve/build/main.js -s . -l tcp://0.0.0.0:$PORT' --prefix dist/Mahkias.WebApp/browser
          test -f dist/Mahkias.WebApp/browser/node_modules/serve/build/main.js

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: Mahkias.WebApp/dist/Mahkias.WebApp/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9591AAF94A2E40E1AA0919DD65B581F8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C7170AD75A824A7284F77B30D28BF9F1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2277AC9A65554EDBA198E888C07388D8 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mahkias'
          package: .
          