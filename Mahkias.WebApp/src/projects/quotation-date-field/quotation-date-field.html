<span class="caption">{{ label }}</span>
<mat-form-field class="quote-date-field" appearance="outline" subscriptSizing="dynamic" (click)="open()">
  <input
    matInput
    [matDatepicker]="picker"
    [ngModel]="date"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="choose($event)"
    [disabled]="disabled"
    readonly
    placeholder="Select date"
    autocomplete="off"
    inputmode="none"
    (beforeinput)="$event.preventDefault()"
    (paste)="$event.preventDefault()"
    (drop)="$event.preventDefault()"
    (keydown)="blockTyping($event)"
  />
  @if (date && !disabled) {
    <button class="clear-date" type="button" matSuffix matTooltip="Clear date" aria-label="Clear date" (click)="clear($event)">
      <mat-icon>close</mat-icon>
    </button>
  }
  <mat-datepicker-toggle matIconSuffix [for]="picker" [disabled]="disabled" (click)="$event.stopPropagation()"></mat-datepicker-toggle>
  <mat-datepicker #picker panelClass="quote-date-panel"></mat-datepicker>
</mat-form-field>
