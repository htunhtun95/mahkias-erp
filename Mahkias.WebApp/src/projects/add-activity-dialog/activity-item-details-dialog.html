<form class="details" (submit)="$event.preventDefault(); confirm()">
  <header>
    <h2>Item details</h2>
    <p>{{ heading }}</p>
    <button class="erp-modal-close" type="button" aria-label="Close" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </header>
  <div class="fields">
    <label class="wide">
      <span>Label</span>
      <input maxlength="200" [(ngModel)]="label" name="label" autocomplete="off" />
    </label>
    <label>
      <span>SerialNo</span>
      <input maxlength="100" [(ngModel)]="serialNo" name="serialNo" autocomplete="off" />
    </label>
    <label>
      <span>TSN</span>
      <input maxlength="100" [(ngModel)]="tsn" name="tsn" autocomplete="off" />
    </label>
    <label>
      <span>TSO</span>
      <input maxlength="100" [(ngModel)]="tso" name="tso" autocomplete="off" />
    </label>
    <label>
      <span>CSN</span>
      <input maxlength="100" [(ngModel)]="csn" name="csn" autocomplete="off" />
    </label>
    <label>
      <span>CSO</span>
      <input maxlength="100" [(ngModel)]="cso" name="cso" autocomplete="off" />
    </label>
  </div>
  <footer>
    <button class="btn" type="button" (click)="cancel()">Cancel</button>
    <button class="btn primary" type="submit">Confirm</button>
  </footer>
</form>
