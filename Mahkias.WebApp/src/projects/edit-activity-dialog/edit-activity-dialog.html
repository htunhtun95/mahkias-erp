@if (isSaving) {
  <div class="import-overlay" role="status" aria-live="polite" aria-busy="true">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <div class="import-overlay-body">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Saving...</p>
    </div>
  </div>
}
<header class="erp-modal-header">
  <div class="erp-modal-title">
    <div>
      <h2>Edit Activity</h2>
      <p class="erp-modal-note">Tip: Use 'or', or '/' between two full part numbers, for alternates (for example P001/P002). A size such as 1/2, or a short revision such as / B, stays in the part number.</p>
    </div>
    <button class="erp-modal-close" type="button" matTooltip="Close" aria-label="Close" [disabled]="isSaving" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</header>

<form [formGroup]="form" (ngSubmit)="save()" (keydown.enter)="onFieldEnter($event)">
  <div class="form-panel">
    <div class="field-grid">
      <label class="field" [class.invalid]="dsnInvalid">
        <span>DSN No<span class="req" aria-hidden="true">*</span></span>
        <input formControlName="dsnNo" autocomplete="off" />
        @if (dsnInvalid) {
          <p class="hint">DSN no is required.</p>
        }
      </label>

      <label class="field" [class.invalid]="typeInvalid">
        <span>Type<span class="req" aria-hidden="true">*</span></span>
        <select formControlName="typeId">
          @for (type of data.types; track type.id) {
            <option [ngValue]="type.id">{{ type.name }}</option>
          }
        </select>
        @if (typeInvalid) {
          <p class="hint">Type is required.</p>
        }
      </label>

      <label class="field" [class.invalid]="quantityInvalid">
        <span>Quantity<span class="req" aria-hidden="true">*</span></span>
        <input type="number" min="0" step="1" formControlName="quantity" />
        @if (quantityInvalid) {
          <p class="hint">Quantity must be a whole number.</p>
        }
      </label>

      <label class="field wide" [class.invalid]="partInvalid">
        <span>Part No<span class="req" aria-hidden="true">*</span></span>
        <app-part-suggest
          [value]="form.controls.partNo.value || ''"
          [disabled]="isSaving"
          [invalid]="partInvalid"
          [minQueryLength]="3"
          ariaLabel="Part No"
          (valueChange)="setPartNo($event)"
          (picked)="pickPart($event)"
        />
        @if (partInvalid) {
          <p class="hint">Part number is required.</p>
        } @else if (partPreview) {
          <p class="hint preview">{{ partPreview }}</p>
        }
      </label>

      <label class="field half">
        <span>Condition</span>
        <app-lookup-combobox
          ariaLabel="Condition"
          [value]="form.controls.condition.value || ''"
          [options]="conditionOptions"
          [disabled]="isSaving"
          (valueChange)="setLookup('condition', $event)"
          (committed)="normalizeCondition()"
        />
      </label>

      <label class="field half">
        <span>Unit</span>
        <app-lookup-combobox
          ariaLabel="Unit"
          [value]="form.controls.unit.value || ''"
          [options]="unitOptions"
          [disabled]="isSaving"
          (valueChange)="setLookup('unit', $event)"
          (committed)="normalizeUnit()"
        />
      </label>

      <label class="field wide">
        <span>SerialNo</span>
        <input formControlName="serialNo" maxlength="100" autocomplete="off" />
      </label>

      <label class="field half">
        <span>TSN</span>
        <input formControlName="tsn" maxlength="100" autocomplete="off" />
      </label>

      <label class="field half">
        <span>TSO</span>
        <input formControlName="tso" maxlength="100" autocomplete="off" />
      </label>

      <label class="field half">
        <span>CSN</span>
        <input formControlName="csn" maxlength="100" autocomplete="off" />
      </label>

      <label class="field half">
        <span>CSO</span>
        <input formControlName="cso" maxlength="100" autocomplete="off" />
      </label>

      <label class="field wide">
        <span>Description</span>
        <textarea appAutoGrow data-min-height="36" formControlName="description" rows="1"></textarea>
      </label>
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }
  </div>

  <div class="actions erp-modal-footer">
    <button type="button" class="btn ghost" (click)="cancel()" [disabled]="isSaving">Cancel</button>
    <button type="submit" class="btn primary" [disabled]="isSaving || form.invalid">
      @if (isSaving) {
        <mat-spinner diameter="18"></mat-spinner>
      }
      {{ isSaving ? 'Saving...' : 'Save Changes' }}
    </button>
  </div>
</form>
