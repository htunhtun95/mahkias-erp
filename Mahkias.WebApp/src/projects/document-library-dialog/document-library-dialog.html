<header class="erp-modal-header">
  <div class="erp-modal-title">
    <div>
      <h2>{{ data.title }}</h2>
      <p class="erp-modal-note">{{ data.note }}</p>
    </div>
    <button class="erp-modal-close" type="button" aria-label="Close" [disabled]="saving" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</header>

<div class="body">
  <app-document-manager
    #library
    class="embedded"
    title=""
    [documents]="data.documents"
    [accept]="data.accept"
    [disabled]="saving"
    [supportingOnly]="!!data.supportingOnly"
    [lockOriginal]="data.kind !== 'project' && !data.supportingOnly"
    [sortBase]="data.sortBase ?? 0"
    [hint]="data.kind === 'project' ? 'Drag a file to change its order.' : (data.supportingOnly ? 'These files are stored with the record. The spreadsheet is still the file that is read.' : 'The original file stays first. Drag the other files to set their order.')"
  ></app-document-manager>
  @if (error) {
    <p class="error">{{ error }}</p>
  }
</div>

<div class="actions">
  <button class="btn ghost" type="button" [disabled]="saving" (click)="cancel()">Cancel</button>
  <button class="btn primary" type="button" [disabled]="saving || !library?.hasChanges || (!!library?.locksOriginal && !library?.hasOriginal)" (click)="save()">
    @if (saving) {
      <mat-spinner diameter="18"></mat-spinner>
      Saving...
    } @else {
      Save
    }
  </button>
</div>
