<div class="app-dialog-container">
<header class="app-dialog-header">
  <div class="erp-modal-title">
    <div>
      <h2>Assign to Group</h2>
      <p class="erp-modal-note">Activities in a group must share the same type. The group takes that type from the first activity assigned to it.</p>
    </div>
    <button class="erp-modal-close" type="button" matTooltip="Close" aria-label="Close" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</header>
<div class="app-dialog-body">
<mat-radio-group class="mode-group" [(ngModel)]="mode" name="mode">
  <mat-radio-button value="existing" [disabled]="!data.groups.length">Existing Group</mat-radio-button>
  <mat-radio-button value="new">New Group</mat-radio-button>
</mat-radio-group>
@if (mode === 'existing') {
  @if (!data.groups.length) {
    <p class="error">Create a group before assigning activities.</p>
  } @else {
    <label class="field">
      <span>Group<span class="req" aria-hidden="true">*</span></span>
      <select [(ngModel)]="groupId" name="groupId">
        @for (group of data.groups; track group.id) {
          <option [ngValue]="group.id">{{ group.name }}</option>
        }
      </select>
    </label>
  }
}
@if (mode === 'new') {
  <label class="field" [class.invalid]="!name.trim() && (groupName.touched || groupName.dirty)">
    <span>Name<span class="req" aria-hidden="true">*</span></span>
    <input #groupName="ngModel" [(ngModel)]="name" name="groupName" maxlength="200" autocomplete="off" [attr.aria-invalid]="!name.trim() && (groupName.touched || groupName.dirty)" />
  </label>
}
</div>
<div class="app-dialog-actions">
  <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
  <button type="button" class="btn primary" (click)="save()" [disabled]="mode === 'new' ? !name.trim() : !groupId">Assign</button>
</div>
</div>
