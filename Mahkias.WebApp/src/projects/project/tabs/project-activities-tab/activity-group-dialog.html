<header class="erp-modal-header">
  <div class="erp-modal-title">
    <div>
      <h2>{{ data?.group ? 'Edit Group' : 'New Activity Group' }}</h2>
      <p class="erp-modal-note">Group related activities into a kit or assembly. Activities can stay ungrouped.</p>
    </div>
    <button class="erp-modal-close" type="button" matTooltip="Close" aria-label="Close" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</header>
<form [formGroup]="form" (ngSubmit)="save()" (keydown.enter)="onFieldEnter($event)">
  <div class="field" [class.invalid]="nameInvalid">
    <label class="control">
      <span class="label">Name<span class="required" aria-hidden="true">*</span></span>
      <input formControlName="name" maxlength="200" autocomplete="off" />
    </label>
    <p class="error">@if (nameInvalid) { Name is required }</p>
  </div>
  <div class="field">
    <label class="control">
      <span class="label">Description</span>
      <textarea formControlName="description" rows="3"></textarea>
    </label>
  </div>
  <div class="actions erp-modal-footer">
    <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn primary" [disabled]="form.invalid">Save</button>
  </div>
</form>
