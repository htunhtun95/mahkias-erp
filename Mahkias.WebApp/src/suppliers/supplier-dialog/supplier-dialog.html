@if (isSaving) {
  <div class="import-overlay" role="status" aria-live="polite" aria-busy="true">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    <div class="import-overlay-body">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Saving...</p>
    </div>
  </div>
}
<header class="erp-modal-header">
  <div class="erp-modal-title">
    <div>
      <h2>{{ isEdit ? 'Edit Supplier' : 'Add Supplier' }}</h2>
      <p class="erp-modal-note">{{ isEdit ? 'Update the supplier name and reference.' : 'Add a supplier name and an optional reference.' }}</p>
    </div>
    <button class="erp-modal-close" type="button" aria-label="Close" [disabled]="isSaving" (click)="cancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</header>

<form [formGroup]="form" (ngSubmit)="save()" (keydown.enter)="onFieldEnter($event)">
  <div class="field" [class.invalid]="nameInvalid">
    <label class="control">
      <span class="label">Supplier Name<span class="required" aria-hidden="true">*</span></span>
      <input formControlName="name" autocomplete="off" />
    </label>
    <p class="error">@if (nameInvalid) { Supplier name is required }</p>
  </div>

  <div class="field">
    <label class="control">
      <span class="label">Reference</span>
      <input formControlName="reference" autocomplete="off" />
    </label>
  </div>

  @if (error) {
    <p class="error">{{ error }}</p>
  }

  <div class="actions erp-modal-footer">
    <button type="button" class="btn ghost" (click)="cancel()" [disabled]="isSaving">Cancel</button>
    <button type="submit" class="btn primary" [disabled]="isSaving || form.invalid">
      @if (isSaving) {
        <mat-spinner diameter="18"></mat-spinner>
      }
      {{ isSaving ? 'Saving...' : 'Save' }}
    </button>
  </div>
</form>
